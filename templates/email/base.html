<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f5f7fb; font-family: Arial, sans-serif; color: #172033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0"
                 style="background: #ffffff; border-radius: 12px;">
            <tr>
              <td style="padding: 24px 32px; border-bottom: 1px solid #e8ebf0;">
                <strong style="font-size: 20px;">Pulsea</strong>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px;">{% block content %}{% endblock %}</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
